# Mapa tecnológico del ecosistema de IA open source.
# Mantenido por la comunidad — enviá un PR para agregar o actualizar.
# Schema v2
#
# Dos secciones:
#   feeds:     fuentes que consume scripts/fetch.py (noticias, releases, modelos)
#   companies: datos del comparador (módulo 03) — labs/tools y sus modelos

feeds:

  # Noticias (RSS/Atom). filter: lista de palabras (al menos una debe aparecer en
  # título o resumen) o null para no filtrar. Tope de 12 items por fuente.
  news_rss:
    - { slug: huggingface, url: "https://huggingface.co/blog/feed.xml",                     filter: null }
    - { slug: meta,        url: "https://engineering.fb.com/feed/",                         filter: [llama, open, model, ai] }
    - { slug: google,      url: "https://blog.google/innovation-and-ai/technology/ai/rss/", filter: [gemma, language model, llm, open, model] }
    - { slug: microsoft,   url: "https://www.microsoft.com/en-us/research/feed/",           filter: [phi, language model, llm, open, model] }
    - { slug: gradient,    url: "https://thegradient.pub/rss/",                             filter: null }
    - { slug: qwen,        url: "https://qwenlm.github.io/blog/index.xml",                  filter: null }
    - { slug: localllama,  url: "https://www.reddit.com/r/LocalLLaMA/.rss",                 filter: null }
    - { slug: simonw,      url: "https://simonwillison.net/atom/everything/",              filter: [llm, model, gpt, claude, llama, gemini, qwen, mistral, local, open weight, ollama] }

  # Releases de herramientas (GitHub Releases API)
  tool_repos:
    - { owner: ollama,       repo: ollama,       slug: ollama,       type: tool }
    - { owner: ggml-org,     repo: llama.cpp,    slug: llama-cpp,    type: tool }
    - { owner: vllm-project, repo: vllm,         slug: vllm,         type: tool }
    - { owner: huggingface,  repo: transformers, slug: transformers, type: tool }
    - { owner: mudler,       repo: LocalAI,      slug: localai,      type: tool }
    - { owner: ggml-org,     repo: whisper.cpp,  slug: whisper-cpp,  type: tool }
    - { owner: unslothai,    repo: unsloth,      slug: unsloth,      type: tool }
    - { owner: sgl-project,  repo: sglang,       slug: sglang,       type: tool }

  # Orgs de HuggingFace a vigilar para nuevos modelos
  hf_orgs:
    - meta-llama
    - mistralai
    - google
    - microsoft
    - EleutherAI
    - stabilityai
    - Qwen
    - deepseek-ai
    - allenai
    - nvidia
    - 01-ai
    - HuggingFaceTB
    - ibm-granite
    - CohereForAI

companies:

  - id: huggingface
    name: Hugging Face
    type: platform
    website: https://huggingface.co
    description_es: "Plataforma central del ecosistema open source AI. Hub de modelos, datasets y Spaces."
    description_en: "Central hub of the open source AI ecosystem. Models, datasets, and Spaces."
    models: []

  - id: meta
    name: Meta AI
    type: lab
    website: https://ai.meta.com
    description_es: "División de IA de Meta. Publica la familia Llama como pesos abiertos."
    description_en: "Meta's AI division. Publishes the Llama family as open weights."
    models:
      - id: meta-llama-3.1-8b
        name: Llama 3.1 8B
        params_b: 8
        context_window: 131072
        open_weights: true
        license: llama3
        multimodal: false
        hf_model_id: meta-llama/Meta-Llama-3.1-8B
      - id: meta-llama-3.1-70b
        name: Llama 3.1 70B
        params_b: 70
        context_window: 131072
        open_weights: true
        license: llama3
        multimodal: false
        hf_model_id: meta-llama/Meta-Llama-3.1-70B
      - id: meta-llama-3.1-405b
        name: Llama 3.1 405B
        params_b: 405
        context_window: 131072
        open_weights: true
        license: llama3
        multimodal: false
        hf_model_id: meta-llama/Meta-Llama-3.1-405B
      - id: meta-llama-3.2-11b
        name: Llama 3.2 11B Vision
        params_b: 11
        context_window: 131072
        open_weights: true
        license: llama3
        multimodal: true
        hf_model_id: meta-llama/Llama-3.2-11B-Vision-Instruct

  - id: mistral
    name: Mistral AI
    type: lab
    website: https://mistral.ai
    description_es: "Laboratorio europeo de IA. Modelos eficientes con pesos abiertos bajo Apache 2.0."
    description_en: "European AI lab. Efficient models with open weights under Apache 2.0."
    models:
      - id: mistral-7b-v0.3
        name: Mistral 7B v0.3
        params_b: 7
        context_window: 32768
        open_weights: true
        license: apache-2.0
        multimodal: false
        hf_model_id: mistralai/Mistral-7B-v0.3
      - id: mixtral-8x7b
        name: Mixtral 8x7B
        params_b: 46.7
        context_window: 32768
        open_weights: true
        license: apache-2.0
        multimodal: false
        hf_model_id: mistralai/Mixtral-8x7B-v0.1
      - id: mistral-nemo
        name: Mistral Nemo 12B
        params_b: 12
        context_window: 131072
        open_weights: true
        license: apache-2.0
        multimodal: false
        hf_model_id: mistralai/Mistral-Nemo-Base-2407

  - id: google
    name: Google (Gemma)
    type: lab
    website: https://ai.google.dev/gemma
    description_es: "Google publica la familia Gemma como modelos de peso abierto."
    description_en: "Google publishes the Gemma family as open-weight models."
    models:
      - id: gemma-2-2b
        name: Gemma 2 2B
        params_b: 2
        context_window: 8192
        open_weights: true
        license: gemma
        multimodal: false
        hf_model_id: google/gemma-2-2b-it
      - id: gemma-2-9b
        name: Gemma 2 9B
        params_b: 9
        context_window: 8192
        open_weights: true
        license: gemma
        multimodal: false
        hf_model_id: google/gemma-2-9b-it
      - id: gemma-2-27b
        name: Gemma 2 27B
        params_b: 27
        context_window: 8192
        open_weights: true
        license: gemma
        multimodal: false
        hf_model_id: google/gemma-2-27b-it

  - id: microsoft
    name: Microsoft (Phi)
    type: lab
    website: https://azure.microsoft.com/products/phi
    description_es: "Familia Phi de Microsoft: modelos pequeños de alto rendimiento bajo MIT."
    description_en: "Microsoft's Phi family: small, high-performance models under MIT license."
    models:
      - id: phi-3-mini-4k
        name: Phi-3 Mini 4K
        params_b: 3.8
        context_window: 4096
        open_weights: true
        license: mit
        multimodal: false
        hf_model_id: microsoft/Phi-3-mini-4k-instruct
      - id: phi-3-medium-128k
        name: Phi-3 Medium 128K
        params_b: 14
        context_window: 131072
        open_weights: true
        license: mit
        multimodal: false
        hf_model_id: microsoft/Phi-3-medium-128k-instruct
      - id: phi-3-vision
        name: Phi-3.5 Vision
        params_b: 4.2
        context_window: 131072
        open_weights: true
        license: mit
        multimodal: true
        hf_model_id: microsoft/Phi-3.5-vision-instruct

  - id: ollama
    name: Ollama
    type: tool
    website: https://ollama.com
    description_es: "Herramienta para correr LLMs localmente con un solo comando."
    description_en: "Tool for running LLMs locally with a single command."
    models: []

  - id: lmstudio
    name: LM Studio
    type: tool
    website: https://lmstudio.ai
    description_es: "IDE de escritorio para ejecutar y experimentar con LLMs locales."
    description_en: "Desktop IDE for running and experimenting with local LLMs."
    models: []

  - id: eleutherai
    name: EleutherAI
    type: researcher
    website: https://www.eleuther.ai
    description_es: "Organización de investigación open source. Crea modelos y evalúa el ecosistema."
    description_en: "Open source research organization. Builds models and evaluates the ecosystem."
    models:
      - id: pythia-12b
        name: Pythia 12B
        params_b: 12
        context_window: 2048
        open_weights: true
        license: apache-2.0
        multimodal: false
        hf_model_id: EleutherAI/pythia-12b
