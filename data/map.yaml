    description_en: "European AI lab. Efficient models with open weights under Apache 2.0."
    models:
      - id: mistral-7b-v0.3
        name: Mistral 7B v0.3
        params_b: 7
        context_window: 32768
        open_weights: true
        license: apache-2.0
        multimodal: false
        hf_model_id: mistralai/Mistral-7B-v0.3
      - id: mixtral-8x7b
        name: Mixtral 8x7B
        params_b: 46.7
        context_window: 32768
        open_weights: true
        license: apache-2.0
        multimodal: false
        hf_model_id: mistralai/Mixtral-8x7B-v0.1
      - id: mistral-nemo
        name: Mistral Nemo 12B
        params_b: 12
        context_window: 131072
        open_weights: true
        license: apache-2.0
        multimodal: false
        hf_model_id: mistralai/Mistral-Nemo-Base-2407

  - id: google
    name: Google (Gemma)
    type: lab
